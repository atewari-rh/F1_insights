[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1insights"
version = "0.1.0"
description = "A season dossier for Formula 1 rounds, with f1frame pass cards."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
f1-insights = "f1insights.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1insights = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
